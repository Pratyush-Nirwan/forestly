<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a3c32" />
      <stop offset="50%" stop-color="#0d5243" />
      <stop offset="100%" stop-color="#062c24" />
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGrad" x1="128" y1="32" x2="384" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.15" />
    </linearGradient>

    <!-- Tree Foliage Gradients -->
    <linearGradient id="topCanopy" x1="256" y1="105" x2="256" y2="235" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="midCanopy" x1="256" y1="180" x2="256" y2="315" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="botCanopy" x1="256" y1="250" x2="256" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Trunk Gradient -->
    <linearGradient id="trunkGrad" x1="236" y1="340" x2="276" y2="415" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Island Mound Gradient -->
    <linearGradient id="islandGrad" x1="120" y1="410" x2="392" y2="445" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="35%" stop-color="#10b981" />
      <stop offset="70%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>

    <!-- Water / Coastal Rim Gradient -->
    <linearGradient id="waterRim" x1="100" y1="435" x2="412" y2="455" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.85" />
    </linearGradient>

    <!-- Drop Shadow Filters -->
    <filter id="badgeShadow" x="0" y="8" width="512" height="504" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#021c17" flood-opacity="0.45" />
    </filter>

    <filter id="tierShadow" x="100" y="90" width="312" height="330" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#02211b" flood-opacity="0.35" />
    </filter>

    <!-- Sun Sparkle Gradient -->
    <linearGradient id="sparkleGrad" x1="365" y1="85" x2="405" y2="125" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- App Squircle Badge -->
  <rect x="28" y="28" width="456" height="456" rx="112" fill="url(#bgGrad)" filter="url(#badgeShadow)" />
  <rect x="28" y="28" width="456" height="456" rx="112" stroke="url(#borderGrad)" stroke-width="4.5" fill="none" />

  <!-- Ambient Light Reflection on Top Curved Edge -->
  <path d="M140 32 C 180 30, 332 30, 372 32 C 320 48, 192 48, 140 32 Z" fill="#6ee7b7" opacity="0.15" />

  <!-- Water Ripple / Coastal Base Ring -->
  <ellipse cx="256" cy="425" rx="156" ry="24" fill="url(#waterRim)" opacity="0.65" />
  <ellipse cx="256" cy="420" rx="140" ry="18" fill="url(#islandGrad)" />

  <!-- Trunk -->
  <rect x="236" y="340" width="40" height="74" rx="10" fill="url(#trunkGrad)" />

  <!-- Bottom Foliage Tier -->
  <path d="M 132 368 C 132 368, 185 368, 256 350 C 327 368, 380 368, 380 368 C 387 362, 387 353, 376 345 L 274 258 C 264 250, 248 250, 238 258 L 136 345 C 125 353, 125 362, 132 368 Z" fill="url(#botCanopy)" filter="url(#tierShadow)" />

  <!-- Middle Foliage Tier -->
  <path d="M 158 296 C 158 296, 202 296, 256 280 C 310 296, 354 296, 354 296 C 360 290, 360 282, 351 274 L 270 192 C 262 184, 250 184, 242 192 L 161 274 C 152 282, 152 290, 158 296 Z" fill="url(#midCanopy)" filter="url(#tierShadow)" />

  <!-- Top Foliage Tier -->
  <path d="M 186 226 C 186 226, 218 226, 256 212 C 294 226, 326 226, 326 226 C 332 220, 332 213, 324 205 L 266 122 C 261 115, 251 115, 246 122 L 188 205 C 180 213, 180 220, 186 226 Z" fill="url(#topCanopy)" filter="url(#tierShadow)" />

  <!-- Sunlit Crown Tip Accent -->
  <circle cx="256" cy="120" r="12" fill="#a7f3d0" opacity="0.85" />

  <!-- Habit Sparkle / Golden Growth Star -->
  <path d="M 382 92 Q 382 114 360 114 Q 382 114 382 136 Q 382 114 404 114 Q 382 114 382 92 Z" fill="url(#sparkleGrad)" />
  <circle cx="382" cy="114" r="4.5" fill="#ffffff" />
</svg>